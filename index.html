<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>故宮華語遊戲館</title>
<meta name="description" content="配合《學華語向前走》第九冊第十課〈故宮博物院〉的華語練習遊戲入口。">
<style>
:root{
  --lacquer:#17100f; --panel:#241a18; --panel-2:#2f2220;
  --vermilion:#c8402f; --gold:#d8a94b; --jade:#7fa88c;
  --silk:#f2e8d5; --muted:#a2917f; --line:#43302b;
  --serif:"Noto Serif CJK TC","Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#2b1b17 0%,transparent 60%),var(--lacquer);
  color:var(--silk);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:34px 36px}

header{border-bottom:2px solid var(--vermilion);padding-bottom:12px;margin-bottom:6px}
h1{font-family:var(--serif);font-weight:900;font-size:2rem;letter-spacing:.08em;margin:0 0 6px;
  text-wrap:balance}
header p{margin:0;font-size:.78rem;letter-spacing:.1em;color:var(--gold);line-height:1.7}

.grid{display:flex;flex-direction:column;gap:12px;margin-top:22px}
a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-left:4px solid var(--gold);
  padding:15px 16px;transition:border-color .15s,background .15s}
a.card:hover{border-left-color:var(--vermilion);background:#332521}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a.card .icon{font-family:var(--serif);font-size:1.9rem;line-height:1;color:var(--gold);
  flex-shrink:0;width:1.5em;text-align:center}
a.card h2{font-family:var(--serif);font-size:1.15rem;margin:0 0 5px;letter-spacing:.04em}
a.card p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.7}
a.card .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
a.card .tags span{font-size:.66rem;letter-spacing:.08em;color:var(--jade);
  border:1px solid var(--line);padding:2px 7px}

footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);
  font-size:.72rem;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>故宮華語遊戲館</h1>
    <p>學華語向前走　第九冊　第十課　故宮博物院</p>
  </header>

  <nav class="grid">
    <a class="card" href="snake.html">
      <div class="icon">蛇</div>
      <div>
        <h2>故宮貪食蛇</h2>
        <p>帶著小蛇吃下正確的生詞。看意思吃詞、選詞填空、照字序吃字三種練習，答錯的詞會在結束時整理成複習清單。</p>
        <div class="tags"><span>生詞 27</span><span>填空 30 句</span><span>可上傳成績</span></div>
      </div>
    </a>

    <a class="card" href="air.html">
      <div class="icon">機</div>
      <div>
        <h2>故宮空戰遊戲</h2>
        <p>1941 式縱向卷軸射擊，一邊閃躲一邊複習本課內容。</p>
        <div class="tags"><span>射擊</span><span>反應練習</span></div>
      </div>
    </a>
  </nav>

  <footer>
    教材依據：僑務委員會《學華語向前走》第九冊（9B）第十課〈故宮博物院〉。<br>
    兩個遊戲都是單一 HTML 檔，可離線開啟；手機、平板、電腦皆可操作。
  </footer>
</div>
</body>
</html>
